[package]
name = "oxedyne_daimond"
version = "0.1.0"
authors = ["Jason Hoogland <jason@oxedyne.io>"]
edition = "2021"
license-file = "LICENSE"
description = "Daimond — the browser-first agentic workspace client, built on the Hematite (fe2o3) library. Source-available so the privacy claim can be verified."
repository = "https://github.com/oxedyne-com/daimond"

[lib]
path = "src/lib.rs"
# `cdylib` lets wasm-pack emit a browser wasm module; `rlib` keeps the
# native consumers (Steel, the agent smoke example) linking as before.
crate-type = ["cdylib", "rlib"]

# Portable dependencies — build on both native and wasm32.  These are
# pulled in by the target-agnostic modules (protocol, session, syntax,
# agent, tools, skills, and the transport-neutral half of llm).
#
# fe2o3 (the Hematite library) is pinned to a fixed revision, and it is pinned
# by GIT rather than by path DELIBERATELY.  This file is the public mirror's:
# anyone who clones this repository must be able to build it, and a path
# dependency resolves only inside the author's own tree.  A path dep here makes
# the whole verifiability claim untestable by the people it is for -- which is
# what happened between 2026-07-21 and 2026-07-27, when a hand-carve from the
# development tree overwrote this block.  The revision below is the fe2o3 commit
# these sources were built and sealed against.
# Certificate verification cannot be switched off in a shipped build: the accept-anything
# verifier and the extra-trust-root hook exist only under this feature, which is OFF, so
# the types that could weaken the tunnel are not in the released wasm at all.
[features]
insecure_testing = []
# `__store_conformance`: the store backend conformance suite (`store::conformance`) exported to the
# page for `dev/verify_storebackend.mjs`, as it is in a debug build.  OFF for a shipping build.
store_conformance = []

[dependencies]
oxedyne_fe2o3_core		= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
oxedyne_fe2o3_jdat		= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
oxedyne_fe2o3_iop_crypto	= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
oxedyne_fe2o3_syntax		= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
oxedyne_fe2o3_graphics		= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
# The regex engine and the glob matcher the file tools search with (`fe2o3_text::regex`,
# `fe2o3_text::glob`).  Portable, so the browser build searches by the same rules the native
# build does -- two matchers would eventually disagree about what a pattern means.
oxedyne_fe2o3_text		= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
# `fe2o3_stds::media` -- what a file IS, from its own bytes, so the viewer offers a
# picture a picture and a document a document.  PORTABLE, and it was native-only
# below until the browser began asking the same question: the wasm build then would
# not compile at all, which the reproducible build caught and the development tree
# could not, since a path dependency there is portable by default.
oxedyne_fe2o3_stds		= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
# `fe2o3_file::office`, which reads and writes the Microsoft Office formats, over
# `fe2o3_file::zip`.  Portable: the crate reaches no filesystem at all, so a `.docx`
# dragged into the browser is read by the same code the native build reads one with.
oxedyne_fe2o3_file		= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
# SHA3-256, the SBJ address function, which WebCrypto does not implement at all, and
# the SHA-256 behind an identity fingerprint.  Pure Rust, so it compiles to wasm32 as
# it stands; it was native-only only while nothing but the native half hashed anything.
oxedyne_fe2o3_hash		= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
oxedyne_fe2o3_ore		= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
# SBJ, the signed container a message and an identity card travel in.  It is here and
# not behind the gateway because the point of a signature is that the RECIPIENT checks
# it: a server that verified and handed over a tidy result would have proved only that
# the server says so.  `default-features = false` drops the post-quantum schemes that
# rest on C, leaving the pure-Rust subset -- Ed25519, SHA3 -- a browser can compile.
oxedyne_fe2o3_sbj		= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42", default-features = false }
# The seal (`seal`): the X25519 + HKDF + AES-256-GCM records a post, a peer envelope and the
# account wrap travel in, one code path for the browser and the native runner.  Already in the
# graph through `fe2o3_sbj`; `mode2` without the default `pq`/`batch` keeps the C-backed schemes
# out, so it compiles to wasm32 as it stands.  `zeroize` (also already in the graph through it)
# clears the one-call secrets -- the ephemeral X25519 scalar and the body key -- when they drop.
oxedyne_fe2o3_crypto		= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42", default-features = false, features = ["mode2"] }
zeroize				= "1.4.2"


# Native-only dependencies.  The Steel WebSocket handler, the O3db
# session backend, and the hand-rolled TLS transport are all native
# concerns; none of these crates target wasm32.  Target-gated so Cargo
# feature unification never touches the wasm build (F6).
# The runner bundle (`seal::runner`, R2d1): a runner's device key is Ed25519 (rulings §4), and the
# seal's recipient is X25519, so the tab maps the Edwards public key to its Montgomery form and the
# runner its seed to the matching scalar (SHA-512, RFC 8032 §5.1.5).  Both crates are already in the
# graph through `fe2o3_crypto` (same versions, no new download) and compile to wasm32 as they stand.
curve25519-dalek		= "4.1.3"
sha2				= { version = "0.10", default-features = false }
# The sans-io half of `fe2o3_mail` -- RFC 5322 message reading and draft building -- behind the
# model's mail tools (`wasm::mail`, `tools::Tool::Mail*`).  `default-features = false` drops the
# crate's server modules (the Maildir store and the passwd user file), which reach `fe2o3_net`
# and do not build for wasm32; what is left needs only `fe2o3_core` and `fe2o3_text`, both
# already in the graph.  On both targets, because the hosted half the mail tools sit in builds
# natively too (U2c4), against whatever host it is given.
oxedyne_fe2o3_mail	= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42", default-features = false }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxedyne_fe2o3_o3db_sync		= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }

tokio = { version = "1.35", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"

# Wasm-only dependencies.  The browser transport replaces the native
# TLS client with `fetch` + `ReadableStream` via web-sys, driven by
# wasm-bindgen-futures.  `getrandom`'s `js` backend must stay confined
# to wasm32 so it never leaks onto native (F6).
oxedyne_fe2o3_stds			= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
# The host's own zone, so a native store dates a decision on the person's clock as the tab does.
oxedyne_fe2o3_datime			= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
# `fe2o3_sys::signal::to_group`, with which the exec tool kills a dropped or timed-out command's
# whole process group.  The module is Linux only, on `nix`, behind the off-by-default feature.
oxedyne_fe2o3_sys			= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42", features = ["signal"] }
# `fe2o3_jdat::pipe`, the framed pipe a `PipeLink` carries store calls over (R1b).  Native only: the
# feature pulls in tokio, which the wasm build never links.
oxedyne_fe2o3_jdat 			= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42", features = ["pipe"] }
# The store server's channel (d1v1 §3): a run reaches the store thread through it, sync or async.
flume = "0.10"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen		= "0.2"
wasm-bindgen-futures	= "0.4"
js-sys			= "0.3"
getrandom		= { version = "0.2", features = ["js"] }

# The blind mail tunnel terminates TLS IN THE BROWSER, so the gateway relays
# ciphertext and holds none of the keys.  This is the one place where writing our own
# would be strictly worse than depending: a subtly wrong certificate verifier means
# the gateway CAN intercept while the user has been told it cannot.
#
# `default-features = false` is load bearing rather than tidy.  rustls 0.23's default
# set reaches `aws-lc-sys`, which is C and does not cross-compile to wasm32; left on,
# the build dies in a build script a long way from the line that caused it.
rustls = { version = "0.23.43", default-features = false, features = ["std", "ring", "tls12", "logging"] }
# The `web` feature is what makes rustls compile for this target at all.  pki-types
# deliberately removes `UnixTime::now()` on wasm32 because `SystemTime::now()` panics
# there, while rustls calls it unconditionally under `std` from `ticketer.rs`,
# `client/handy.rs` and `time_provider.rs` -- call sites a caller never touches, so
# supplying a `TimeProvider` does not save you.  `web` restores it over `web-time`.
rustls-pki-types = { version = "1.15.1", features = ["web"] }
# The bundled Mozilla root store, 121 anchors.  A browser cannot reach the platform's
# own trust store from wasm, so the anchors travel in the bundle.
webpki-roots = "1.0.9"
web-sys = { version = "0.3", features = [
	"AbortController",
	"AbortSignal",
	"Headers",
	"ReadableStream",
	"ReadableStreamDefaultReader",
	"ReadableStreamReadResult",
	"Request",
	"RequestInit",
	"RequestMode",
	"Response",
	"Window",
	"WorkerGlobalScope",
	# The cloud-storage index, which JS keeps in `localStorage` (see `wasm::cloud`).
	"Storage",
	# OPFS filesystem edge (main-thread async path).
	"Navigator",
	"Performance",
	"StorageManager",
	"FileSystemDirectoryHandle",
	"FileSystemFileHandle",
	"FileSystemGetFileOptions",
	"FileSystemGetDirectoryOptions",
	"FileSystemHandle",
	"FileSystemRemoveOptions",
	"FileSystemWritableFileStream",
	"WritableStream",
	"Blob",
	"File",
	# Telling the page the real folder was taken away (see `opfs::notify_folder_lost`),
	# and telling it which file was just written (see `opfs::announce_write`) -- the
	# second needs the init dictionary, because it carries a path.
	"CustomEvent",
	"CustomEventInit",
	"EventTarget",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies.ring]
version		= "0.17.14"
features	= ["wasm32_unknown_unknown_js"]

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
oxedyne_fe2o3_test			= { git = "https://github.com/oxedyne-com/fe2o3", rev = "0cf60a86c1c68dc189b3f2081f19dbcfe787df42" }
