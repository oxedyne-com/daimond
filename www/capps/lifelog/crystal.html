<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:">
<title>Lifelog</title>
<style>
:root{--bg:transparent;--sf:rgba(128,128,128,.10);--tx:#5c5c5c;--mu:#8d8d8d;--bd:rgba(128,128,128,.32);
--ac:#4a7fd0;--on:#fff;--fo:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
--mo:ui-monospace,SFMono-Regular,Consolas,monospace;--fs:14px;--rd:8px;--rs:6px;
--good:#10893E;--bad:#C4314B;--warn:#B87A00}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
/* No overflow on the body: `overflow-x:hidden` makes it a scroll container, and
   then the page scrolls inside the frame instead of the frame growing to fit it.
   Nothing here is wider than its column, and the verifier checks that. */
body{font:400 var(--fs)/1.5 var(--fo);color:var(--tx);padding:0 0 6px;
overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);
border-radius:var(--rs);padding:7px 9px;width:100%;min-width:0}
input:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:var(--ac)}
svg{display:block}

/* ── the bar across the top ──────── */
.hd{display:flex;flex-direction:column;gap:7px;padding:0 0 9px;margin:0 0 12px;
border-bottom:1px solid var(--bd)}
.row{display:flex;align-items:center;gap:6px;min-width:0}
.gap{flex:1;min-width:0}
.chips{display:flex;gap:5px;min-width:0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* The view switch never scrolls and never shrinks: it is in a `seg` and not in a
   `chips`, because a `chips` is a scroller and at 375px the lane names took the
   width and left "Life" cut off inside it. */
.seg{display:flex;gap:5px;flex:none}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:var(--rs);color:var(--mu);
font-size:.82em;line-height:1.5;padding:3px 9px;white-space:nowrap;flex:none;
transition:transform .07s,background .12s,color .12s}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.chip:active{transform:scale(.95)}
.chip.q{padding:3px 7px;font-family:var(--mo)}
.tag{font-size:.78em;color:var(--mu);white-space:nowrap;font-family:var(--mo)}
.tag b{color:var(--ac);font-weight:650}
.cf{margin:7px 0 8px}

/* ── section furniture ──────── */
.sh{font-size:.79em;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);
white-space:nowrap}
.shrow{display:flex;align-items:center;gap:8px;margin:0 0 7px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rd);padding:10px 12px;
margin:0 0 10px}
.empty{color:var(--mu);font-size:.9em;padding:10px 0;font-style:italic}

/* ── the tile pad: the thing you actually press ──────── */
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin:0 0 12px}
.tile{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rd);padding:9px 10px;
min-height:66px;display:flex;flex-direction:column;justify-content:space-between;gap:5px;
transition:transform .08s,background .14s,border-color .14s}
.tile:active{transform:scale(.955);background:var(--ac);border-color:var(--ac);color:var(--on)}
.tile:active .ts,.tile:active .tn{color:var(--on)}
.tn{font-weight:600;font-size:.94em;line-height:1.25;color:var(--tx)}
.ts{font-size:.76em;color:var(--mu);font-family:var(--mo);line-height:1.3}
.tile.acc{border-color:var(--ac)}
.tile.acc .tn{color:var(--ac)}
.tile.run{background:var(--ac);border-color:var(--ac)}
.tile.run .tn,.tile.run .ts{color:var(--on)}
.tile.wide{grid-column:1/-1;min-height:52px;flex-direction:row;align-items:center;
justify-content:flex-start;gap:10px}
.step{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:var(--sf);
border:1px solid var(--ac);border-radius:var(--rd);padding:8px 10px}
.stepb{width:38px;height:38px;flex:none;border:1px solid var(--bd);border-radius:var(--rs);
display:flex;align-items:center;justify-content:center;font-size:1.2em;background:var(--bg)}
.stepb:active{background:var(--ac);color:var(--on);border-color:var(--ac)}
.amt{font-family:var(--mo);font-size:1.05em;font-weight:650;color:var(--tx);min-width:62px;
text-align:center}
.go{background:var(--ac);color:var(--on);border-radius:var(--rs);padding:9px 14px;font-weight:650;
font-size:.92em;white-space:nowrap;border:1px solid var(--ac)}
.go:active{transform:scale(.97)}
.ghost{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:var(--rs);
padding:9px 14px;font-weight:600;font-size:.92em;white-space:nowrap}
.pickbtn{width:100%}
.toast{display:flex;align-items:center;gap:8px;border:1px solid var(--ac);border-radius:var(--rd);
padding:7px 10px;margin:0 0 12px;font-size:.88em;background:var(--sf)}
.toast.err{border-color:var(--bad)}
.toast .gap{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── numbers ──────── */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px}
.st{min-width:0}
.sk{font-size:.75em;color:var(--mu);letter-spacing:.02em;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis}
.sv{font-size:1.32em;font-weight:650;line-height:1.25;color:var(--tx);letter-spacing:-.01em;
font-variant-numeric:tabular-nums}
.sv u{font-size:.6em;font-weight:500;color:var(--mu);text-decoration:none;margin-left:2px}
.bar{height:4px;background:var(--bd);border-radius:3px;overflow:hidden;margin:5px 0 2px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ac)}
.tgt{font-size:.7em;color:var(--mu);font-family:var(--mo);display:flex;gap:4px;align-items:center}
.tgt b{font-weight:700}

/* ── rows ──────── */
.er{display:flex;align-items:baseline;gap:8px;width:100%;padding:8px 0;
border-top:1px solid var(--bd)}
.er:first-child{border-top:0}
.et{font-family:var(--mo);font-size:.76em;color:var(--mu);flex:none;width:38px}
.en{flex:1;min-width:0;font-size:.93em;color:var(--tx)}
.en small{display:block;color:var(--mu);font-size:.82em;font-family:var(--mo)}
.ev{font-family:var(--mo);font-size:.83em;color:var(--mu);flex:none;text-align:right;
white-space:nowrap;font-variant-numeric:tabular-nums}
.src{flex:none;width:6px;height:6px;border-radius:50%;background:var(--ac);opacity:.55;
align-self:center}
.chev{flex:none;color:var(--mu);font-size:.9em}
.dayh{font-size:.75em;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
color:var(--mu);padding:10px 0 2px;border-top:1px solid var(--bd)}
.dayh:first-child{border-top:0;padding-top:0}
.grp{margin:0 0 4px}
.grph{display:flex;align-items:baseline;gap:8px;padding:9px 0 3px;font-size:.85em;font-weight:650;
color:var(--tx);border-top:1px solid var(--bd)}
.setr{display:flex;align-items:baseline;gap:8px;width:100%;padding:4px 0 4px 10px;font-size:.88em}
.setr .ev{font-size:.8em}

/* ── charts ──────── */
.leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:3px 10px;
margin:8px 0 0}
.lg{display:flex;align-items:center;gap:6px;font-size:.8em;min-width:0}
.sw{width:9px;height:9px;border-radius:2px;flex:none}
.lgn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.lgv{font-family:var(--mo);color:var(--mu);flex:none;font-variant-numeric:tabular-nums}
.pie{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* ── forms and pickers ──────── */
.fr{margin:0 0 11px}
.fl{font-size:.78em;color:var(--mu);margin:0 0 4px;letter-spacing:.02em}
.num{display:flex;align-items:center;gap:7px}
.num input{text-align:center;font-family:var(--mo);font-weight:600}
.acts{display:flex;gap:8px;align-items:center;margin:14px 0 4px}
.pickr{display:flex;align-items:baseline;gap:8px;width:100%;padding:9px 0;
border-top:1px solid var(--bd);font-size:.92em}
.back{display:flex;align-items:center;gap:6px;font-size:.9em;color:var(--mu);margin:0 0 10px}
.fbox{border:1px solid var(--bd);border-radius:var(--rd);padding:9px 10px;margin:0 0 9px}
/* Inside a field box the chips WRAP rather than scroll. Everywhere else a chip row
   is a scroller, but here the last of the five types sat off the end of it on a
   phone with nothing on screen to say it was there. */
.fbox .chips{flex-wrap:wrap;overflow-x:visible}
.frm{flex:none;color:var(--mu);font-size:1.05em;padding:0 3px}
.hint{font-size:.82em;color:var(--mu);margin:7px 0 0}
.hint+.fr{margin-top:13px}
.plus{font-size:1.1em;font-weight:700;line-height:1.2;padding:2px 8px}
.h1{font-size:1.16em;font-weight:650;color:var(--tx);line-height:1.3;margin:0 0 2px}
.mem{margin:16px 0 0;border-top:1px solid var(--bd);padding:10px 0 0}
.mem summary{font-size:.79em;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
color:var(--mu);cursor:pointer;list-style:none}
.mem summary::-webkit-details-marker{display:none}
.mem summary::before{content:"\25B8 ";color:var(--mu)}
.mem[open] summary::before{content:"\25BE "}
.mk{font-family:var(--mo);font-size:.76em;color:var(--mu);margin:9px 0 2px}
.mv{font-size:.87em;white-space:pre-wrap}
</style>
</head><body><div id="app"></div>
<script>
(function () {
'use strict';

// ── The channel ────────────
// `id` matches an answer to a question: the replies carry no `cmd`.
var PR = 1, seq = 0, pend = {}, APP = document.getElementById('app');

function post(o) { o.dc = 1; o.v = PR; parent.postMessage(o, '*'); }
function req(cmd, x) {
	var id = 'q' + (++seq), m = { dc: 1, v: PR, cmd: cmd, id: id }, k;
	for (k in x) if (x.hasOwnProperty(k)) m[k] = x[k];
	return new Promise(function (r) { pend[id] = r; parent.postMessage(m, '*'); });
}
function read(p) { return req('asset', { path: p }); }
function save(p, t, mode) { return req('save', { path: p, text: t, mode: mode || 'append' }); }
/// A JSON file, or null. There is no `list` verb, so a missing shard reads as an
/// error and an error is simply "nothing there yet".
function jread(p) {
	return read(p).then(function (r) {
		if (!r || r.error || !r.text) return null;
		try { return JSON.parse(r.text); } catch (e) { return null; }
	});
}

// ── Small things ────────────
function esc(s) {
	return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
		.replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
/// A button carrying an action and its argument, which is how every tap gets
/// back here: one delegated listener, no handler per element.
function B(cls, a, v, inner) {
	return '<button class="' + cls + '" data-a="' + a + '" data-v="' + esc(v) + '">' + inner + '</button>';
}
function C(n, a, v, on) { return B('chip' + (on ? ' on' : ''), a, v, esc(n)); }
/// One reading: its name, its number and its unit.
function ST(k, s, extra) {
	return '<div class="st"><div class="sk">' + esc(k) + '</div><div class="sv">' + esc(s.v)
		+ (s.u ? '<u>' + esc(s.u) + '</u>' : '') + '</div>' + (extra || '') + '</div>';
}
function p2(n) { return (n < 10 ? '0' : '') + n; }
function num(v) { v = (v === '' || v == null) ? null : +v; return (v != null && isFinite(v)) ? v : null; }
function fmt(n, dp) {
	if (n == null || !isFinite(n)) return '—';
	var a = Math.abs(n);
	if (dp == null) dp = a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 1 : 2;
	var s = n.toFixed(dp).replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1');
	// Global: without it only the first group is separated and a month of volume
	// reads "1,234567".
	return s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function dur(sec) {
	if (sec == null || !isFinite(sec)) return '—';
	var m = Math.round(sec / 60), h = Math.floor(m / 60);
	return h ? (h + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '')) : (m + 'm');
}
function ago(ms) {
	if (ms == null) return '—';
	var m = Math.round(ms / 60000);
	if (m < 90) return m + 'm';
	var h = Math.round(m / 60);
	return h < 36 ? h + 'h' : Math.round(h / 24) + 'd';
}

// Dates. Never `toISOString`: a meal at 23:30 belongs to today, and UTC would
// move it. Both stamps are kept — `at` exact with its offset, `day` the local
// date the entry belongs to, which is not the same thing once a lane moves its
// day boundary off midnight.
function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function isoAt(d) {
	var o = -d.getTimezoneOffset(), s = o < 0 ? '-' : '+', a = Math.abs(o);
	return ymd(d) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds())
		+ s + p2(Math.floor(a / 60)) + ':' + p2(a % 60);
}
function dayOf(d, start) { return ymd(new Date(d.getTime() - (start || 0) * 60000)); }
function tms(at) { var t = Date.parse(at); return isFinite(t) ? t : 0; }
function hhmm(at) { var d = new Date(tms(at)); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function dnum(s) { var a = String(s).split('-'); return Math.floor(Date.UTC(+a[0], +a[1] - 1, +a[2]) / 864e5); }
function dstr(n) {
	var d = new Date(n * 864e5);
	return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate());
}
function dow(n) { return (n + 4) % 7; }
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

// A bucket is a day, a week or a month, named by the day it starts on.
function bstart(day, per) {
	if (per === 'month') return day.slice(0, 7) + '-01';
	if (per === 'week') {
		var n = dnum(day), ws = (IDX && IDX.weekStart != null) ? IDX.weekStart : 1;
		return dstr(n - ((dow(n) - ws + 7) % 7));
	}
	return day;
}
function bshift(b, per, k) {
	if (per === 'month') {
		var a = b.split('-'), y = +a[0], m = +a[1] - 1 + k;
		y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
		return y + '-' + p2(m + 1) + '-01';
	}
	return dstr(dnum(b) + k * (per === 'week' ? 7 : 1));
}
function bend(b, per) { return bshift(b, per, 1); }
function bdays(b, per) { return per === 'day' ? 1 : dnum(bend(b, per)) - dnum(b); }
function blabel(b, per, short) {
	var d = new Date(b + 'T12:00:00');
	if (per === 'month') return MON[d.getMonth()] + (short ? '' : ' ' + d.getFullYear());
	if (per === 'week') return (short ? '' : 'Week of ') + d.getDate() + ' ' + MON[d.getMonth()];
	if (short) return String(d.getDate());
	var t = ymd(new Date());
	if (b === t) return 'Today';
	if (b === dstr(dnum(t) - 1)) return 'Yesterday';
	return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];
}

// ── Expressions ────────────
// `eval` and `new Function` are blocked by the policy, so `kg*(1+reps/30)` is
// parsed by hand: shunting-yard to RPN once per field, a stack walk per entry.
var PREC = { '+': 1, '-': 1, '*': 2, '/': 2 };
function lex(src) {
	var s = String(src), t = [], i = 0, j;
	while (i < s.length) {
		var c = s.charAt(i);
		if (c === ' ') { i++; continue; }
		if (/[0-9.]/.test(c)) {
			j = i; while (j < s.length && /[0-9.]/.test(s.charAt(j))) j++;
			t.push({ n: parseFloat(s.slice(i, j)) }); i = j; continue;
		}
		if (/[A-Za-z_]/.test(c)) {
			j = i; while (j < s.length && /[A-Za-z0-9_]/.test(s.charAt(j))) j++;
			t.push({ v: s.slice(i, j) }); i = j; continue;
		}
		t.push({ o: c }); i++;
	}
	return t;
}
function rpn(src) {
	var t = lex(src), out = [], ops = [], prev = null, i;
	for (i = 0; i < t.length; i++) {
		var k = t[i];
		if (k.n != null || k.v) { out.push(k); prev = k; continue; }
		if (k.o === '(') { ops.push(k); prev = k; continue; }
		if (k.o === ')') {
			while (ops.length && ops[ops.length - 1].o !== '(') out.push(ops.pop());
			ops.pop(); prev = k; continue;
		}
		// A minus with no value before it negates rather than subtracts.
		if (k.o === '-' && (!prev || prev.o === '(' || PREC[prev.o])) out.push({ n: 0 });
		while (ops.length && PREC[ops[ops.length - 1].o] >= PREC[k.o]) out.push(ops.pop());
		ops.push(k); prev = k;
	}
	while (ops.length) out.push(ops.pop());
	return out;
}
function runRpn(prog, get) {
	var st = [], i, a, b;
	for (i = 0; i < prog.length; i++) {
		var k = prog[i];
		if (k.n != null) { st.push(k.n); continue; }
		if (k.v) { var x = get(k.v); if (x == null) return null; st.push(x); continue; }
		b = st.pop(); a = st.pop();
		if (a == null || b == null) return null;
		st.push(k.o === '+' ? a + b : k.o === '-' ? a - b : k.o === '*' ? a * b
			: (b ? a / b : null));
	}
	var r = st.pop();
	return (typeof r === 'number' && isFinite(r)) ? r : null;
}

// ── The store ────────────
//   index.json               lanes present, week start
//   lanes/<lane>.json        fields, tiles, templates, targets
//   cat/<lane>.json          the catalogue
//   log/<lane>/YYYY-MM.jsonl one shard per month, append-only
//
// Monthly shards because `save` in append mode is a read-then-write: a year in
// one file would rewrite hundreds of kilobytes for every meal.
var IDX = null, LANE = {}, CAT = {}, LOG = {}, GOT = {};

/// Last write wins per id, and an import never replaces what a person typed.
function ingest(ln, e) {
	var m = LOG[ln] || (LOG[ln] = {}), p = m[e.id];
	if (p) {
		if (e.src === 'import' && p.src !== 'import') return;
		if ((e.w || 0) < (p.w || 0)) return;
	}
	m[e.id] = e;
}
function ingestText(ln, txt) {
	var ls = String(txt).split('\n'), i;
	for (i = 0; i < ls.length; i++) {
		var s = ls[i].trim(); if (!s) continue;
		try { var e = JSON.parse(s); } catch (x) { continue; }
		if (e && e.id) ingest(ln, e);
	}
}
/// Every month shard touching [from, to). A shard that is not there yet is
/// remembered as read, so a lane with no history costs one failed read and no
/// more.
function shards(ln, from, to) {
	var a = from.slice(0, 7), b = to.slice(0, 7), jobs = [], guard = 0;
	while (a <= b && guard++ < 60) {
		var key = ln + '/' + a;
		if (!GOT[key]) {
			GOT[key] = 1;
			jobs.push(read('log/' + ln + '/' + a + '.jsonl').then((function (l) {
				return function (r) { if (r && !r.error && r.text) ingestText(l, r.text); };
			})(ln)));
		}
		var y = +a.slice(0, 4), m = +a.slice(5, 7) + 1;
		if (m > 12) { m = 1; y++; }
		a = y + '-' + p2(m);
	}
	return jobs.length ? Promise.all(jobs) : null;
}
/// Append one or more entries, grouped into the shard each one's day belongs to.
/// One save per shard, not one per entry: a template that expands to three meals
/// is one line-triple in one write.
function put(ln, es) {
	var by = {}, i, ps = [];
	for (i = 0; i < es.length; i++) {
		var e = es[i];
		e.w = Date.now();
		ingest(ln, e);
		var ym = e.day.slice(0, 7);
		(by[ym] || (by[ym] = [])).push(JSON.stringify(e));
	}
	for (var ym2 in by) {
		GOT[ln + '/' + ym2] = 1;
		ps.push(save('log/' + ln + '/' + ym2 + '.jsonl', by[ym2].join('\n') + '\n', 'append'));
	}
	return Promise.all(ps).then(function (rs) {
		for (var j = 0; j < rs.length; j++) {
			if (rs[j] && rs[j].error) { toast('Not saved: ' + rs[j].error, 1); return false; }
		}
		return true;
	});
}
function nid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// ── Fields ────────────
function fdef(l, k) {
	var f = l.fields || [], i;

document.addEventListener('click', function (ev) {

	var l = lane(), sc = S.scr;

	if (a === 'per') { S.per = v; S.off = 0; S.tile = -1; loadRange().then(draw); }
	else if (a === 'off') { S.off = Math.min(0, S.off + (+v)); S.tile = -1; loadRange().then(draw); }
	else if (a === 'now') { S.off = 0; loadRange().then(draw); }
	else if (a === 'view') { S.view = v; S.tile = -1; S.scr = null; loadRange().then(draw); }

	else if (a === 'fagg') { readLane(); var q5 = v.split('|'); sc.fs[+q5[0]].agg = q5[1]; draw(); }

	else if (a === 'edit') {

window.addEventListener('message', function (ev) {

	if (m.id && pend[m.id]) { pend[m.id](m); delete pend[m.id]; return; }
	if (m.cmd !== 'data') return;
	D = m.data || {};
	theme(D._theme);
	// Every top-level key with content, named, on every data message. A second
	// `rendered` naming fewer keys tears the frame down just as a first would.
	var ks = [], k;
	for (k in D) if (D.hasOwnProperty(k) && k.charAt(0) !== '_') ks.push(k);
	post({ cmd: 'rendered', keys: ks });
	// ONCE. `data` arrives again on every theme, ink and skin change, and a
	// second `start()` while the first is still reading would seed the store a
	// second time.
	if (!STARTED) {
		STARTED = true;
		start().catch(function (e) {
			APP.innerHTML = '<div class="empty">' + esc('Could not open the log: ' + e) + '</div>';

}
LASTW = APP.clientWidth;
post({ cmd: 'ready' });

// ── The furniture it arrives with ────────────
// Two working lanes and a third for readings, with real numbers in them, which
// is the difference between an empty app and one somebody keeps. The food
// catalogue is per 100 g.
var FOODS = ('oats|Rolled oats|Grain|379|13.2|67.7|6.5|10.1;milk|Whole milk|Dairy|61|3.2|4.8|3.3|0;'
	+ 'yog|Greek yoghurt|Dairy|59|10|3.6|0.4|0;ched|Cheddar|Dairy|403|25|1.3|33|0;'
	+ 'egg|Eggs|Protein|143|12.6|0.7|9.5|0;chick|Chicken breast|Protein|165|31|0|3.6|0;'
	+ 'salm|Salmon|Protein|208|20.4|0|13.4|0;lent|Lentils, cooked|Protein|116|9|20|0.4|7.9;'
	+ 'rice|White rice, cooked|Grain|130|2.7|28.2|0.3|0.4;pasta|Pasta, cooked|Grain|131|5|25|1.1|1.8;'
	+ 'bread|Wholemeal bread|Grain|247|13|41|3.4|7;pot|Potato, boiled|Veg|77|2|17.5|0.1|2.2;'
	+ 'broc|Broccoli|Veg|34|2.8|6.6|0.4|2.6;spin|Spinach|Veg|23|2.9|3.6|0.4|2.2;'
	+ 'ban|Banana|Fruit|89|1.1|22.8|0.3|2.6;app|Apple|Fruit|52|0.3|13.8|0.2|2.4;'
	+ 'alm|Almonds|Fat|579|21.2|21.6|49.9|12.5;pnut|Peanut butter|Fat|588|25|20|50|6;'
	+ 'oil|Olive oil|Fat|884|0|0|100|0;choc|Dark chocolate|Snack|546|4.9|61|31|7;'
	+ 'coff|Black coffee|Drink|1|0.1|0|0|0;beer|Beer, 4.5%|Drink|43|0.5|3.6|0|0').split(';');
var LIFTS = ('sq|Back squat|Legs;dl|Deadlift|Back;bp|Bench press|Chest;ohp|Overhead press|Shoulders;'
	+ 'row|Barbell row|Back;pull|Pull-up|Back;rdl|Romanian deadlift|Legs;lp|Leg press|Legs;'
	+ 'lat|Lat pulldown|Back;dip|Dip|Chest;curl|Dumbbell curl|Arms;push|Triceps pushdown|Arms').split(';');

function seed() {
	var i, a, foods = [], lifts = [];
	for (i = 0; i < FOODS.length; i++) {
		a = FOODS[i].split('|');
		foods.push({ id: a[0], n: a[1], grp: a[2],
			v: { kcal: +a[3], p: +a[4], c: +a[5], ft: +a[6], fib: +a[7] } });
	}
	for (i = 0; i < LIFTS.length; i++) {
		a = LIFTS[i].split('|');
		lifts.push({ id: a[0], n: a[1], grp: a[2] });
	}
	// A derived field that scales a catalogue number by how much was eaten.
	function sc(k, n, u) {
		return { k: k, t: 'num', n: n, u: u, agg: 'sum', d: { c: 'food', k: k, per: 100, by: 'g' } };
	}
	var diet = {
		id: 'diet', n: 'Diet', dayStart: 0, primary: 'food', second: 'meal',
		fields: [
			{ k: 'food', t: 'ref', n: 'Food', agg: 'count' },
			{ k: 'meal', t: 'enum', n: 'Meal', o: ['Breakfast', 'Lunch', 'Dinner', 'Snack'], agg: 'count' },
			{ k: 'g', t: 'num', n: 'Amount', u: 'g', agg: 'sum', step: 10 },
			sc('kcal', 'Energy', 'kcal'), sc('p', 'Protein', 'g'), sc('c', 'Carbs', 'g'),
			sc('ft', 'Fat', 'g'), sc('fib', 'Fibre', 'g')
		],
		show: ['kcal', 'p', 'c', 'ft', 'fib'],
		targets: [{ f: 'kcal', p: 'day', dir: 'max', v: 2400 }, { f: 'p', p: 'day', dir: 'min', v: 120 },
			{ f: 'fib', p: 'day', dir: 'min', v: 30 }],
		tiles: [
			// A scale tile carries the usual amount, so the tile already reads
			// "80 g · 303 kcal" and one tap opens it at that rather than at zero.
			{ m: 'scale', n: 'Oats', f: { food: 'oats', g: 80, meal: 'Breakfast' }, by: 'g', step: 10 },
			{ m: 'scale', n: 'Milk', f: { food: 'milk', g: 250, meal: 'Breakfast' }, by: 'g', step: 50 },
			{ m: 'scale', n: 'Banana', f: { food: 'ban', g: 120, meal: 'Snack' }, by: 'g', step: 20 },
			{ m: 'scale', n: 'Chicken', f: { food: 'chick', g: 200, meal: 'Dinner' }, by: 'g', step: 25 },
			{ m: 'scale', n: 'Rice', f: { food: 'rice', g: 250, meal: 'Dinner' }, by: 'g', step: 50 },
			{ m: 'scale', n: 'Eggs', f: { food: 'egg', g: 100, meal: 'Breakfast' }, by: 'g', step: 50 },
			{ m: 'scale', n: 'Yoghurt', f: { food: 'yog', g: 170, meal: 'Snack' }, by: 'g', step: 25 },
			{ m: 'preset', n: 'Coffee', f: { food: 'coff', g: 250, meal: 'Snack' }, by: 'g' },
			{ m: 'expand', n: 'Porridge breakfast', e: [
				{ food: 'oats', g: 80, meal: 'Breakfast' }, { food: 'milk', g: 250, meal: 'Breakfast' },
				{ food: 'ban', g: 120, meal: 'Breakfast' }] },
			{ m: 'expand', n: 'Chicken & rice', e: [
				{ food: 'chick', g: 200, meal: 'Dinner' }, { food: 'rice', g: 250, meal: 'Dinner' },
				{ food: 'broc', g: 150, meal: 'Dinner' }] },
			{ m: 'form', n: 'Something else', fs: ['food', 'g', 'meal'] }
		]
	};
	var gym = {
		id: 'gym', n: 'Gym', dayStart: 0, sess: true, primary: 'lift', title: 'name',
		setFields: ['lift', 'kg', 'reps'],
		fields: [
			{ k: 'name', t: 'enum', n: 'Session', o: ['Push', 'Pull', 'Legs', 'Full body'], agg: 'count' },
			{ k: 'lift', t: 'ref', n: 'Lift', agg: 'count' },
			{ k: 'kg', t: 'num', n: 'Weight', u: 'kg', agg: 'max', ru: 'max', step: 2.5 },
			{ k: 'reps', t: 'num', n: 'Reps', agg: 'sum', step: 1 },
			{ k: 'vol', t: 'num', n: 'Volume', u: 'kg', agg: 'sum', d: { e: 'kg*reps' } },
			{ k: 'e1rm', t: 'num', n: 'Est. 1RM', u: 'kg', agg: 'max', ru: 'max', d: { e: 'kg*(1+reps/30)' } },
			{ k: 'dur', t: 'dur', n: 'Time', agg: 'sum' }
		],
		show: ['vol', 'reps', 'e1rm', 'dur'],
		sessShow: ['vol', 'reps', 'e1rm', 'dur'],
		targets: [{ f: 'vol', p: 'week', dir: 'min', v: 24000 }],
		tiles: [
			{ m: 'tap', n: 'Start a session', sess: 1, f: { name: 'Full body' }, s: 'opens the session' },
			{ m: 'timer', n: 'Cardio', by: 'dur', f: {} },
			{ m: 'form', n: 'One set', fs: ['lift', 'kg', 'reps'] }
		]
	};
	var body = {
		// The day starts at 04:00, so sleep recorded at 02:00 belongs to the night
		// before rather than to the morning after.
		id: 'body', n: 'Body', dayStart: 240, primary: 'mood',
		fields: [
			{ k: 'kg', t: 'num', n: 'Weight', u: 'kg', agg: 'last', ru: 'mean', step: 0.1 },
			{ k: 'waist', t: 'num', n: 'Waist', u: 'cm', agg: 'last', ru: 'mean', step: 0.5 },
			{ k: 'hr', t: 'num', n: 'Resting HR', u: 'bpm', agg: 'mean', step: 1 },
			{ k: 'sleep', t: 'dur', n: 'Slept', agg: 'sum', ru: 'mean' },
			{ k: 'mood', t: 'enum', n: 'Mood', o: ['Low', 'Flat', 'Fine', 'Good', 'Great'], agg: 'last' },
			{ k: 'fast', t: 'bool', n: 'Fasted', agg: 'count' }
		],
		show: ['kg', 'sleep', 'hr', 'mood', 'kg:since'],
		targets: [{ f: 'sleep', p: 'day', dir: 'min', v: 27000 }],
		tiles: [
			{ m: 'form', n: 'Weigh in', fs: ['kg', 'waist'] },
			{ m: 'form', n: 'Slept', fs: ['sleep', 'mood'] },
			{ m: 'form', n: 'Resting HR', fs: ['hr', 'fast'] },
			{ m: 'timer', n: 'Nap', by: 'sleep', f: {} },
			{ m: 'tap', n: 'Feeling good', f: { mood: 'Good' } }
		]
	};
	IDX = { v: 1, lanes: ['diet', 'gym', 'body'], weekStart: 1, seeded: isoAt(new Date()) };
	return Promise.all([
		save('index.json', JSON.stringify(IDX), 'replace'),
		save('lanes/diet.json', JSON.stringify(diet), 'replace'),
		save('lanes/gym.json', JSON.stringify(gym), 'replace'),
		save('lanes/body.json', JSON.stringify(body), 'replace'),
		save('cat/diet.json', JSON.stringify({ attrs: { grp: 'Food group' }, items: foods }), 'replace'),
		save('cat/gym.json', JSON.stringify({ attrs: { grp: 'Muscle group' }, items: lifts }), 'replace')
	]);
}
})();
</script></body></html>
